[project]
name = "medical-triage"
version = "0.3.0"
description = "Medical text classification API"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "fastapi",
    "joblib",
    "onnxruntime>=1.29.0",
    "pandas",
    "prometheus-client>=0.26.0",
    "scikit-learn",
    "uvicorn[standard]",
]

[dependency-groups]
dev = [
    "httpx",
    "joblib-stubs>=1.5.3.1.20260117",
    "mypy",
    "onnx>=1.22.0",
    "pandas-stubs>=3.0.5.260730",
    "pre-commit>=4.6.2",
    "pytest",
    "ruff",
    "scikit-learn-stubs>=0.0.3",
    "skl2onnx>=1.20.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "D",
]
ignore = [
    "D100", # Missing docstring in public module
    "D103", # Missing docstring in public function
    "D104", # Missing docstring in public package (__init__.py)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# FastAPI uses Depends in function argument defaults by design
"src/medical_triage/presentation/api/routes.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/medical_triage"]
